<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ShortsTok Unblocked - AI Brainrot Feed</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body, html {
      width: 100%;
      height: 100%;
      background: #000;
      color: #fff;
      overflow: hidden;
    }
    .feed-container {
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .video-card {
      width: 100%;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
    }
    canvas {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    /* Overlay Controls */
    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px;
      pointer-events: none;
      background: linear-gradient(180deg, rgba(0,0,0,0.35) 0%, rgba(0,0,0,0) 20%, rgba(0,0,0,0) 70%, rgba(0,0,0,0.7) 100%);
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: auto;
      margin-top: 8px;
    }
    .top-tab {
      font-weight: 700;
      font-size: 17px;
      opacity: 0.6;
      cursor: pointer;
      padding: 4px 8px;
    }
    .top-tab.active {
      opacity: 1;
      border-bottom: 3px solid #fe2c55;
    }
    .sound-btn {
      background: rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.3);
      color: #fff;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      cursor: pointer;
      backdrop-filter: blur(5px);
    }
    /* Right Action Bar */
    .action-bar {
      position: absolute;
      right: 12px;
      bottom: 90px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      pointer-events: auto;
      z-index: 10;
    }
    .action-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: none;
      border: none;
      color: #fff;
      cursor: pointer;
    }
    .icon-circle {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(0,0,0,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      backdrop-filter: blur(8px);
      transition: transform 0.15s ease;
    }
    .action-btn:active .icon-circle {
      transform: scale(1.25);
    }
    .action-label {
      font-size: 11px;
      margin-top: 4px;
      font-weight: 600;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    }
    .like-btn.liked .icon-circle {
      color: #fe2c55;
      background: rgba(254,44,85,0.2);
    }
    /* Bottom Info Bar */
    .bottom-info {
      pointer-events: auto;
      margin-bottom: 20px;
      max-width: 80%;
    }
    .username {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .badge-ai {
      background: #00f2fe;
      color: #000;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 800;
    }
    .caption {
      font-size: 14px;
      line-height: 1.4;
      margin-bottom: 8px;
      text-shadow: 0 1px 3px rgba(0,0,0,0.9);
    }
    .audio-tag {
      font-size: 12px;
      opacity: 0.9;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    /* Controls hint */
    .nav-hints {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: auto;
      opacity: 0.5;
      transition: opacity 0.3s;
    }
    .nav-hints:hover { opacity: 1; }
    .hint-btn {
      background: rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.2);
      color: white;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }
    /* Comments Sheet */
    .comments-modal {
      position: absolute;
      bottom: -100%;
      left: 0;
      width: 100%;
      height: 60%;
      background: #121212;
      border-top-left-radius: 16px;
      border-top-right-radius: 16px;
      z-index: 100;
      transition: bottom 0.3s ease;
      display: flex;
      flex-direction: column;
      padding: 16px;
      pointer-events: auto;
    }
    .comments-modal.open { bottom: 0; }
    .comments-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid #2a2a2a;
      font-weight: 700;
    }
    .comments-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .comment-item {
      display: flex;
      gap: 10px;
      font-size: 13px;
    }
    .comment-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #fe2c55;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }
    .comment-content { flex: 1; }
    .comment-user { font-weight: 700; color: #aaa; margin-bottom: 2px; }
  </style>
</head>
<body>

<div class="feed-container" id="feed">
  <!-- Dynamic Video Cards Rendered by JS -->
</div>

<!-- Modal for Comments -->
<div class="comments-modal" id="commentsModal">
  <div class="comments-header">
    <span id="commentsCountTitle">Comments</span>
    <button style="background:none; border:none; color:#fff; font-size:20px; cursor:pointer;" id="closeComments">✕</button>
  </div>
  <div class="comments-list" id="commentsList">
    <!-- Comments populate here -->
  </div>
</div>

<script>
  // Web Audio Context for Sound Effects
  let audioCtx = null;
  let soundEnabled = false;

  function initAudio() {
    if(!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
    soundEnabled = !soundEnabled;
    return soundEnabled;
  }

  function playSFX(type) {
    if (!soundEnabled || !audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    const now = audioCtx.currentTime;

    if (type === 'boing') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(150, now);
      osc.frequency.exponentialRampToValueAtTime(600, now + 0.3);
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.linearRampToValueAtTime(0, now + 0.3);
      osc.start(now);
      osc.stop(now + 0.3);
    } else if (type === 'fart') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(80, now);
      osc.frequency.linearRampToValueAtTime(30, now + 0.4);
      gain.gain.setValueAtTime(0.4, now);
      gain.gain.linearRampToValueAtTime(0, now + 0.4);
      osc.start(now);
      osc.stop(now + 0.4);
    } else if (type === 'squeak') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(800, now);
      osc.frequency.exponentialRampToValueAtTime(1400, now + 0.15);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.linearRampToValueAtTime(0, now + 0.15);
      osc.start(now);
      osc.stop(now + 0.15);
    } else if (type === 'pop') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(400, now);
      osc.frequency.exponentialRampToValueAtTime(80, now + 0.1);
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.linearRampToValueAtTime(0, now + 0.1);
      osc.start(now);
      osc.stop(now + 0.1);
    }
  }

  // 10 AI Funny Video Feeds
  const VIDEOS = [
    {
      id: 1,
      user: "@ai_cat_king",
      caption: "POV: Your orange cat thinks it's a 100ft skyscraper god 🐱🏙️ #ai #funny #brainrot #cat",
      likes: "1.4M",
      comments: [
        { u: "Bro_Guy21", t: "Bro thinks he's Godzilla 💀" },
        { u: "MemeLord99", t: "The giant meow destroyed my city" },
        { u: "PixelFan", t: "AI video prompts are getting wild" }
      ],
      sfx: 'boing',
      draw: (ctx, t, w, h) => {
        // City background
        ctx.fillStyle = '#0f0f23';
        ctx.fillRect(0,0,w,h);
        for(let i=0; i<8; i++) {
          ctx.fillStyle = '#1a1a3a';
          let bx = (i*w/7);
          let bh = h*0.4 + Math.sin(i)*50;
          ctx.fillRect(bx, h-bh, w/8 - 5, bh);
          // Windows
          ctx.fillStyle = '#ffee55';
          for(let wy=h-bh+20; wy<h-20; wy+=30) {
            if((i+wy)%2===0) ctx.fillRect(bx+10, wy, 15, 15);
          }
        }
        // Giant Cat
        let catY = h*0.45 + Math.sin(t*3)*15;
        let catX = w*0.5;
        // Body
        ctx.fillStyle = '#ff8c00';
        ctx.beginPath();
        ctx.ellipse(catX, catY+80, 110, 140, 0, 0, Math.PI*2);
        ctx.fill();
        // Head
        ctx.beginPath();
        ctx.arc(catX, catY-40, 90, 0, Math.PI*2);
        ctx.fill();
        // Ears
        ctx.beginPath();
        ctx.moveTo(catX-70, catY-90); ctx.lineTo(catX-30, catY-160); ctx.lineTo(catX-10, catY-100);
        ctx.moveTo(catX+70, catY-90); ctx.lineTo(catX+30, catY-160); ctx.lineTo(catX+10, catY-100);
        ctx.fill();
        // Laser Eyes
        let laserGlow = Math.sin(t*15) > 0;
        ctx.strokeStyle = laserGlow ? '#ff0055' : '#00ffff';
        ctx.lineWidth = 12;
        ctx.beginPath();
        ctx.moveTo(catX-30, catY-40); ctx.lineTo(catX-200, h);
        ctx.moveTo(catX+30, catY-40); ctx.lineTo(catX+200, h);
        ctx.stroke();
      }
    },
    {
      id: 2,
      user: "@brainrot_labs",
      caption: "Spicy Pizza Slice fighting for its life in a 3 AM microwave 🍕🔥 #pizza #aiart #memes",
      likes: "892K",
      comments: [
        { u: "ChefTony", t: "Why is the pizza doing martial arts? 😂" },
        { u: "LateNightSnack", t: "The cheese is sentient!" }
      ],
      sfx: 'fart',
      draw: (ctx, t, w, h) => {
        // Microwave interior
        ctx.fillStyle = '#111';
        ctx.fillRect(0,0,w,h);
        ctx.strokeStyle = '#00ffcc';
        ctx.lineWidth = 4;
        ctx.strokeRect(w*0.1, h*0.2, w*0.8, h*0.6);
        
        // Rotating plate
        let plateAngle = t * 2;
        let px = w*0.5 + Math.cos(plateAngle)*40;
        let py = h*0.6 + Math.sin(plateAngle)*15;

        // Pizza Triangle
        ctx.save();
        ctx.translate(px, py);
        ctx.rotate(Math.sin(t*5)*0.2);
        ctx.fillStyle = '#ffcc00';
        ctx.beginPath();
        ctx.moveTo(0, -90);
        ctx.lineTo(-70, 70);
        ctx.lineTo(70, 70);
        ctx.closePath();
        ctx.fill();

        // Pepperoni eyes
        ctx.fillStyle = '#cc0000';
        ctx.beginPath();
        ctx.arc(-20, -10, 16, 0, Math.PI*2);
        ctx.arc(20, -10, 16, 0, Math.PI*2);
        ctx.fill();

        // Screaming mouth
        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.ellipse(0, 30, 20, 25 + Math.sin(t*10)*10, 0, 0, Math.PI*2);
        ctx.fill();
        ctx.restore();

        // Microwave timer overlay
        ctx.fillStyle = '#00ff44';
        ctx.font = 'bold 36px monospace';
        ctx.fillText("00:" + String(Math.floor(30 - (t%30))).padStart(2,'0'), w*0.15, h*0.28);
      }
    },
    {
      id: 3,
      user: "@corgi_protocol",
      caption: "Corgi rocket launch failed successfully 🐶🚀 #corgi #space #ai #funny",
      likes: "2.1M",
      comments: [
        { u: "DogeLover", t: "To the moon!! 🚀" },
        { u: "SpaceX_Official", t: "Better than our rocket test" }
      ],
      sfx: 'squeak',
      draw: (ctx, t, w, h) => {
        // Space Background
        ctx.fillStyle = '#050510';
        ctx.fillRect(0,0,w,h);
        ctx.fillStyle = '#fff';
        for(let i=0; i<30; i++) {
          ctx.fillRect((i*137)%w, (i*243)%h, 3, 3);
        }

        // Flying Corgi
        let cx = w*0.5 + Math.sin(t*2)*60;
        let cy = h*0.5 + Math.cos(t*3)*80;

        // Rocket thruster fire
        ctx.fillStyle = '#ff4400';
        ctx.beginPath();
        ctx.arc(cx, cy+70+Math.random()*20, 30, 0, Math.PI*2);
        ctx.fill();

        // Corgi Body
        ctx.fillStyle = '#e69500';
        ctx.beginPath();
        ctx.ellipse(cx, cy, 60, 80, 0, 0, Math.PI*2);
        ctx.fill();
        // White belly
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.ellipse(cx, cy+10, 35, 50, 0, 0, Math.PI*2);
        ctx.fill();
        // Helmet
        ctx.strokeStyle = 'rgba(0, 242, 254, 0.8)';
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.arc(cx, cy-40, 55, 0, Math.PI*2);
        ctx.stroke();
      }
    },
    {
      id: 4,
      user: "@gigachad_ai",
      caption: "When the AI Roomba gains sentient consciousness and starts flexing 🧹💪 #roomba #gigachad #sigma",
      likes: "3.5M",
      comments: [
        { u: "Alpha_01", t: "Roomba grindset never stops" },
        { u: "DustBunny", t: "I surrender my trash bro" }
      ],
      sfx: 'boing',
      draw: (ctx, t, w, h) => {
        // Gym background
        ctx.fillStyle = '#1e1e24';
        ctx.fillRect(0,0,w,h);

        let rx = w*0.5;
        let ry = h*0.55;

        // Bouncing Roomba Body
        ctx.fillStyle = '#333';
        ctx.beginPath();
        ctx.arc(rx, ry, 110, 0, Math.PI*2);
        ctx.fill();
        ctx.strokeStyle = '#fe2c55';
        ctx.lineWidth = 10;
        ctx.stroke();

        // Muscular AI Arms Flexing
        let flex = Math.sin(t*6)*20;
        ctx.fillStyle = '#666';
        // Left arm
        ctx.beginPath();
        ctx.arc(rx-130, ry-40+flex, 35, 0, Math.PI*2);
        ctx.fill();
        // Right arm
        ctx.beginPath();
        ctx.arc(rx+130, ry-40+flex, 35, 0, Math.PI*2);
        ctx.fill();

        // Chad Sunglasses
        ctx.fillStyle = '#000';
        ctx.fillRect(rx-50, ry-30, 45, 25);
        ctx.fillRect(rx+5, ry-30, 45, 25);
        ctx.fillRect(rx-10, ry-25, 20, 5);
      }
    },
    {
      id: 5,
      user: "@dancing_broccoli",
      caption: "Toddler POV: Broccoli performing a Broadway show to avoid getting eaten 🥦🎭 #food #parenting #ai",
      likes: "620K",
      comments: [
        { u: "MomLife99", t: "My kid would still refuse to eat it" },
        { u: "VeggieTales", t: "Give this broccoli an Oscar!" }
      ],
      sfx: 'pop',
      draw: (ctx, t, w, h) => {
        // Spotlight stage
        ctx.fillStyle = '#0a0a0a';
        ctx.fillRect(0,0,w,h);
        
        ctx.fillStyle = 'rgba(255,255,200,0.2)';
        ctx.beginPath();
        ctx.moveTo(w*0.5, 0);
        ctx.lineTo(w*0.1, h);
        ctx.lineTo(w*0.9, h);
        ctx.fill();

        // Dancing Broccoli
        let bx = w*0.5 + Math.sin(t*8)*40;
        let by = h*0.6 + Math.abs(Math.cos(t*8))* -30;

        // Fluffy Green Top
        ctx.fillStyle = '#228b22';
        ctx.beginPath();
        ctx.arc(bx-30, by-50, 45, 0, Math.PI*2);
        ctx.arc(bx+30, by-50, 45, 0, Math.PI*2);
        ctx.arc(bx, by-80, 50, 0, Math.PI*2);
        ctx.fill();

        // Stem
        ctx.fillStyle = '#7ed957';
        ctx.fillRect(bx-25, by-30, 50, 80);

        // Top Hat
        ctx.fillStyle = '#000';
        ctx.fillRect(bx-35, by-140, 70, 50);
        ctx.fillRect(bx-50, by-95, 100, 12);
      }
    }
  ];

  let currentIndex = 0;
  const feed = document.getElementById('feed');

  function renderFeed() {
    feed.innerHTML = '';
    VIDEOS.forEach((vid, idx) => {
      const card = document.createElement('div');
      card.className = 'video-card';
      card.style.transform = `translateY(${(idx - currentIndex) * 100}%)`;

      card.innerHTML = `
        <canvas id="canvas-${vid.id}"></canvas>
        <div class="overlay">
          <div class="top-bar">
            <span class="top-tab">Following</span>
            <span class="top-tab active">For You</span>
            <button class="sound-btn" onclick="toggleSound(this)">🔊 Sound ${soundEnabled ? 'ON' : 'OFF'}</button>
          </div>

          <div class="nav-hints">
            <button class="hint-btn" onclick="nextVideo(-1)">▲</button>
            <button class="hint-btn" onclick="nextVideo(1)">▼</button>
          </div>

          <div class="action-bar">
            <button class="action-btn like-btn" onclick="toggleLike(this)">
              <div class="icon-circle">♥</div>
              <span class="action-label">${vid.likes}</span>
            </button>
            <button class="action-btn" onclick="openComments(${idx})">
              <div class="icon-circle">💬</div>
              <span class="action-label">${vid.comments.length}</span>
            </button>
            <button class="action-btn" onclick="playSFX('${vid.sfx}')">
              <div class="icon-circle">🔊</div>
              <span class="action-label">SFX</span>
            </button>
          </div>

          <div class="bottom-info">
            <div class="username">${vid.user} <span class="badge-ai">AI GENERATED</span></div>
            <div class="caption">${vid.caption}</div>
            <div class="audio-tag">🎵 Original Sound - AI Brainrot Viral Mix</div>
          </div>
        </div>
      `;
      feed.appendChild(card);
    });
    initCanvases();
  }

  function toggleSound(btn) {
    let active = initAudio();
    btn.innerText = `🔊 Sound ${active ? 'ON' : 'OFF'}`;
  }

  function toggleLike(btn) {
    btn.classList.toggle('liked');
    playSFX('pop');
  }

  function nextVideo(dir) {
    let newIndex = currentIndex + dir;
    if (newIndex >= 0 && newIndex < VIDEOS.length) {
      currentIndex = newIndex;
      updatePositions();
      playSFX(VIDEOS[currentIndex].sfx);
    }
  }

  function updatePositions() {
    const cards = document.querySelectorAll('.video-card');
    cards.forEach((card, idx) => {
      card.style.transform = `translateY(${(idx - currentIndex) * 100}%)`;
    });
  }

  // Canvas Animation Loops
  let animId = null;
  function initCanvases() {
    VIDEOS.forEach((vid) => {
      const canvas = document.getElementById(`canvas-${vid.id}`);
      if (!canvas) return;
      const ctx = canvas.getContext('2d');

      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      resize();

      let startTime = Date.now();
      function loop() {
        let t = (Date.now() - startTime) / 1000;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        vid.draw(ctx, t, canvas.width, canvas.height);
        requestAnimationFrame(loop);
      }
      loop();
    });
  }

  // Keyboard Navigation (Up/Down arrows)
  window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown') nextVideo(1);
    if (e.key === 'ArrowUp') nextVideo(-1);
  });

  // Touch Swipe Navigation for Chromebook/Mobile
  let touchStartY = 0;
  window.addEventListener('touchstart', (e) => {
    touchStartY = e.touches[0].clientY;
  });
  window.addEventListener('touchend', (e) => {
    let touchEndY = e.changedTouches[0].clientY;
    if (touchStartY - touchEndY > 50) nextVideo(1);
    if (touchEndY - touchStartY > 50) nextVideo(-1);
  });

  // Comment Modal Controls
  function openComments(idx) {
    const modal = document.getElementById('commentsModal');
    const list = document.getElementById('commentsList');
    const title = document.getElementById('commentsCountTitle');
    
    let comments = VIDEOS[idx].comments;
    title.innerText = `${comments.length} Comments`;
    list.innerHTML = '';

    comments.forEach(c => {
      list.innerHTML += `
        <div class="comment-item">
          <div class="comment-avatar">${c.u[0]}</div>
          <div class="comment-content">
            <div class="comment-user">${c.u}</div>
            <div>${c.t}</div>
          </div>
        </div>
      `;
    });

    modal.classList.add('open');
  }

  document.getElementById('closeComments').addEventListener('click', () => {
    document.getElementById('commentsModal').classList.remove('open');
  });

  // Start feed
  renderFeed();
</script>

</body>
</html>
